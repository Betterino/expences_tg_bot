[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["expenses_bot", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path, so `import expenses_bot` works without installing the package.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
